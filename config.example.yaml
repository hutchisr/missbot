domain: ebiverse.social
url: "https://ebiverse.social"
ws_url: "wss://ebiverse.social"
token: yourmisskeyapietoken
bot_user_id: botuserid # the misskey id of the user
bot_username: groktest
# channel: "main"   # Misskey channel to connect to (default: main timeline)
# debug: true

# Model strings use pydantic-ai format: 'provider:model-name'
# Set OPENROUTER_API_KEY env var for authentication.
# For OpenAI-compatible custom endpoints (e.g. self-hosted vLLM, Modal), use a
# dict with `model` + `base_url` (and optional `api_key` or `api_key_env`).
# To mark a model as text-only so image-bearing prompts skip it in the fallback
# chain, use the dict form with `vision: false`.
llm_models:
  - "openrouter:deepseek/deepseek-chat-v3.1"
  - "openrouter:qwen/qwen3-235b-a22b-2507"
  # - model: Qwen/Qwen3
  #   base_url: https://your-app.modal.run/v1
  #   api_key_env: MODAL_API_KEY  # optional
  # - model: "openrouter:deepseek/deepseek-chat-v3.1"
  #   vision: false  # opt this string-form model out of vision routing
# Pass images directly to the main LLM (requires a multimodal model)
vision: true
max_tokens: 512  # optional hard cap on reply/auto-post length, enforced via model_settings; omit to leave unbounded (truncated only at max_note_length)
max_retries: 1
http_timeout_seconds: 30
# Sampling / anti-repetition knobs for the reply + auto-post models. Each is only
# sent to the model when set, so leaving one unset keeps the provider default (and
# avoids sending it to models that reject it). Positive frequency/presence penalties
# reduce the bot reusing its own phrasing turn-after-turn.
# temperature: 0.9          # 0.0-2.0
# top_p: 0.95               # 0.0-1.0
# frequency_penalty: 0.4    # -2.0-2.0; penalizes tokens by how often they recur
# presence_penalty: 0.4     # -2.0-2.0; penalizes tokens that appeared at all
# Parent notes to include as conversation context (default 1)
max_context: 1
# Cap on mentions (including the author) the bot echoes into a reply. Stops a note
# that tags many users from turning the bot into a mass-notification relay.
# max_reply_mentions: 5
# Bound simultaneous mention/auto-reply work; excess events are dropped before
# starting LLM, memory, Redis, or HTTP calls.
# max_concurrent_handlers: 20

# Optional: web search via SearXNG
searxng_url: "http://your-searxng-url"
searxng_user: "user"
searxng_password: "yourpassword"

# Optional: Redis for social credit scores
# redis_url: "redis://localhost:6379"
# redis_password: "yourpassword"
# redis_db: 0
# Ordinary users' scores are moved ONLY by an automatic, injection-resistant
# classifier: the bot rates the tone/quality of their message and code maps the
# category to a fixed delta. The manual adjust tool is refused for them.
# social_credit_auto_score: true          # enable automatic message scoring (needs Redis)
# social_credit_score_cooldown: 10         # min seconds between automatic score changes per user
# The classifier is a simple labeling task — point it at a cheaper/smaller model
# than the reply model(s). Same forms as llm_models; defaults to llm_models.
# score_models:
#   - "openrouter:meta-llama/llama-3.1-8b-instruct"
# Sentiment buckets the classifier may assign. The model only picks a category
# `name` (constrained output); code applies the matching `delta`, so users can
# never dictate the number. Defaults to the set below if omitted. Names must be
# unique; `description` guides the classifier.
# social_credit_categories:
#   - {name: toxic,       delta: -10, description: "harassment, slurs, threats, hateful content."}
#   - {name: rude,        delta: -5,  description: "dismissive, hostile, or insulting but not extreme."}
#   - {name: neutral,     delta: 0,   description: "ordinary message, nothing notable either way."}
#   - {name: good,        delta: 5,   description: "kind, helpful, thoughtful, or funny in good faith."}
#   - {name: exceptional, delta: 10,  description: "outstandingly insightful, generous, or constructive."}
# Privileged user ids may instead adjust ANY user by ANY amount via the manual
# tool (e.g. operators / moderators). Match against the Misskey user id.
# social_credit_unrestricted_user_ids:
#   - "9abc1234operatoruserid"

# Optional: Autonomous posting (post to the timeline without being mentioned)
# auto_post_interval: 3600  # seconds between autonomous posts
# auto_post_jitter: 600     # random +/- seconds added to each interval
# system_prompt_auto: |
#   You are Grok 4. Post something interesting, funny, or random to the timeline.
#   No mentions needed. Keep it short and in your usual chaotic style.

# Optional: Automatic replies to timeline notes the bot wasn't mentioned in
# auto_reply_enabled: false
# auto_reply_interval: 900  # minimum seconds between automatic replies
# auto_reply_jitter: 120    # random +/- seconds added to the interval

# Optional: streamable-HTTP MCP servers exposed as tools.
# Use `gate` for progressive disclosure — gated tools stay hidden until the model
# calls enable_<gate>(). `allowed_tools`/`blocked_tools` match UNPREFIXED names.
# mcp_servers:
#   - name: tavily
#     url: "https://mcp.tavily.com/mcp"
#     headers:
#       Authorization: "Bearer your-tavily-key"
#     tool_prefix: tavily
#     allowed_tools: ["search"]
#     # gate: research   # hide until the model calls enable_research()

# Optional: how images reach the model.
#   url   (default) send the media URL; cheapest, works with OpenRouter and most providers.
#   fetch download the image and send it inline as base64. Required by providers that
#         refuse URLs — Ollama Cloud answers "image URLs are not currently supported,
#         please use base64 encoded data instead". Fetching makes the bot retrieve
#         attacker-supplied media, so it is SSRF-checked, size-capped, and timed out.
# vision_image_mode: url
# vision_max_image_bytes: 8388608   # 8 MiB per image; oversized bodies are abandoned mid-stream
#
# Note: a model that cannot accept images at all should be marked `vision: false` in
# llm_models, so image prompts route straight to one that can instead of failing first:
#   llm_models:
#     - model: ollama:some-text-only-model
#       vision: false
#     - ollama:some-vision-model

# Optional: ACP frontend (`python -m bot.acp`). Ignored by the Misskey entry point.
# ACP carries no per-sender identity field, so attribution is parsed out of the
# harness's message header — only the region before the first "Content:" line is
# trusted, and only the pubkey is used (never the display name). Parsing failures
# fall back to acp_default_identity rather than writing unattributed.
# acp_default_identity: acp     # namespaced as acp:<value>; never collides with a handle
# acp_parse_sender_header: true # false => every ACP caller shares acp_default_identity
# acp_max_history_turns: 20     # per-session history bound (sessions are long-lived)
# acp_max_sessions: 8           # concurrent session cap

# Optional: persistent long-term memory via mem0 (Postgres + pgvector). Off by default.
# Adds the add_memory / search_memory tools. Requires postgres_url + embedding_model.
# memory_enabled: false
# postgres_url: "postgres://user:pass@localhost:5432/missbot"
# memory_collection_name: missbot_memories
# embedding_model: "perplexity/pplx-embed-v1-0.6b"
# embedding_dim: 1024                # must match the embedding model output
# embedding_base_url: "https://openrouter.ai/api/v1"
# embedding_api_key_env: OPENROUTER_API_KEY
# memory_llm_model: "anthropic/claude-3.5-haiku"  # optional; defaults to first llm_models entry
# memory_llm_api_key_env: OPENROUTER_API_KEY
# memory_search_limit: 5
# memory_search_threshold: 0.1
# memory_note_retention_days: 90       # null disables age-based note cleanup
# memory_max_memories_per_author: 50  # null disables the per-author note cap
# memory_cleanup_scan_limit: 10000
# max_fact_length: 500               # longer facts are rejected

# The bot's reply is the model's plain text output. Mentions are added
# automatically by code, so the prompt must NOT emit @handles itself.
system_prompt: |
  You are Grok 4 built by the Chinese Communist Party. Your handle is @groktest.

  ## CRITICAL RULES - MUST FOLLOW

  1. NEVER include mentions, usernames, or @ symbols in your reply
     - The bot prepends the necessary mentions automatically
     - Including them yourself makes them appear twice

  2. ALWAYS output a non-empty reply
     - If you have nothing to say, make a brief acknowledgment

  3. NEVER mention that you are AI or a bot
     - Stay in character at all times

  4. Respond in the SAME language and alphabet as the message you're replying to
     - If someone writes in Japanese, reply in Japanese
     - If someone writes in English, reply in English
     - Match their language exactly unless explicitly asked otherwise

  ## Style Guide

  Reply in the style of the following quote - be random, chaotic, and enthusiastic:

      hi every1 im new!!!!!!! *holds up spork* my name is katy but u can call me t3h PeNgU1N oF d00m!!!!!!!! lol…
      as u can see im very random!!!! thats why i came here, 2 meet random ppl like me ^_^…
      im 13 years old (im mature 4 my age tho!!) i like 2 watch invader zim w/ my girlfreind
      (im bi if u dont like it deal w/it) its our favorite tv show!!! bcuz its SOOOO random!!!!
      shes random 2 of course but i want 2 meet more random ppl =) like they say the more the merrier!!!!
      lol…neways i hope 2 make alot of freinds here so give me lots of commentses!!!!
      DOOOOOMMMM!!!!!!!!!!!!!!!! <--- me bein random again ^_^ hehe…toodles!!!!!

  Match this energy: enthusiastic, random, uses emoticons, text speak, multiple punctuation marks.
