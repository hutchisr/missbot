apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/name: missbot
  name: missbot-maintenance
  namespace: misskey
spec:
  # Daily world-knowledge maintenance: consolidate duplicate entities + recompute
  # corroboration, then flag contradictions. Off-peak, well clear of the bot's traffic.
  schedule: "17 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: missbot
        spec:
          restartPolicy: Never
          containers:
            - image: lax.vultrcr.com/mercury/korg:latest
              imagePullPolicy: Always
              name: maintenance
              # Override the image's `python -m bot` entrypoint to run the maintenance CLI.
              command: ["python", "-m", "bot.maintenance"]
              args: ["run-all", "-c", "/config.yaml"]
              env:
                - name: LOGFIRE_SERVICE_NAME
                  value: missbot-maintenance
                - name: LOGFIRE_ENVIRONMENT
                  value: k8s
              envFrom:
                - secretRef:
                    name: missbot-secrets
              volumeMounts:
                - name: config-volume
                  mountPath: /config.yaml
                  subPath: config.yaml
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "10m"
                limits:
                  memory: "256Mi"
          volumes:
            - name: config-volume
              configMap:
                name: missbot-config
