apiVersion: apps/v1
kind: Deployment
metadata:
  name: missbot-acp
  namespace: misskey
  labels:
    app.kubernetes.io/name: missbot-acp
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: missbot-acp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: missbot-acp
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: vultr-cr-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: acp
          image: lax.vultrcr.com/mercury/korg:latest
          imagePullPolicy: Always
          command: ["python", "-m", "bot.acp", "serve"]
          args:
            - "--config"
            - "/config.yaml"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--token-env"
            - "ACP_TOKEN"
          ports:
            - name: acp
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: LOGFIRE_SERVICE_NAME
              value: missbot-acp
            - name: LOGFIRE_ENVIRONMENT
              value: k8s
            - name: ACP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: missbot-acp-auth
                  key: ACP_TOKEN
          envFrom:
            - secretRef:
                name: missbot-secrets
          volumeMounts:
            - name: config-volume
              mountPath: /config.yaml
              subPath: config.yaml
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: acp
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: acp
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: acp
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: config-volume
          secret:
            secretName: missbot-config
---
apiVersion: v1
kind: Service
metadata:
  name: missbot-acp
  namespace: misskey
spec:
  selector:
    app.kubernetes.io/name: missbot-acp
  ports:
    - name: acp
      port: 8080
      targetPort: acp
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: missbot-acp
  namespace: misskey
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - missbot-acp
  rules:
    - host: missbot-acp
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: missbot-acp
                port:
                  number: 8080
