# kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- base.yaml
- maintenance-settings.yaml
- maintenance.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
- name: missbot-config
  namespace: misskey
  files:
  - config.yaml=config.yaml
  options:
    labels:
      app.kubernetes.io/name: missbot
- name: missbot-secrets
  namespace: misskey
  envs:
  - secrets.txt
  options:
    labels:
      app.kubernetes.io/name: missbot
replacements:
- source:
    kind: ConfigMap
    name: missbot-maintenance-settings
    fieldPath: data.schedule
  targets:
  - select:
      kind: CronJob
      name: missbot-maintenance
    fieldPaths:
    - spec.schedule
- source:
    kind: ConfigMap
    name: missbot-maintenance-settings
    fieldPath: data.timeZone
  targets:
  - select:
      kind: CronJob
      name: missbot-maintenance
    fieldPaths:
    - spec.timeZone
