name: Mirror Radicle master

on:
  workflow_dispatch:
  schedule:
    # Avoid the top of the hour, when scheduled Actions are most likely to queue.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: mirror-radicle-master
  cancel-in-progress: false

env:
  RADICLE_VERSION: "1.10.1"
  RADICLE_SHA256: 9354f7f6241a88ddca1d41a080aa6337ddfc5dc682b8de78ab6d418b5782225a
  RADICLE_REPOSITORY_ID: rad:zLseUdKik1qrsiTonrjSoPGYbC6g

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out GitHub mirror
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Radicle
        shell: bash
        run: |
          set -euo pipefail

          archive="${RUNNER_TEMP}/radicle.tar.xz"
          install_dir="${RUNNER_TEMP}/radicle"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "https://files.radicle.dev/releases/latest/radicle-${RADICLE_VERSION}-x86_64-unknown-linux-musl.tar.xz"
          printf '%s  %s\n' "${RADICLE_SHA256}" "${archive}" | sha256sum --check -
          mkdir -p "${install_dir}"
          tar -xJf "${archive}" --strip-components=1 -C "${install_dir}"
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"

      - name: Fetch canonical Radicle master
        shell: bash
        env:
          RAD_HOME: ${{ runner.temp }}/radicle-home
          RADICLE_IDENTITY_KEY_B64: ${{ secrets.RADICLE_IDENTITY_KEY_B64 }}
          RAD_PASSPHRASE: ${{ secrets.RADICLE_IDENTITY_PASSPHRASE }}
        run: |
          set -euo pipefail

          if test -n "${RADICLE_IDENTITY_KEY_B64}"; then
            rad config init --alias github-mirror
            printf '%s' "${RADICLE_IDENTITY_KEY_B64}" | base64 --decode > "${RAD_HOME}/keys/radicle"
            chmod 600 "${RAD_HOME}/keys/radicle"
            ssh-keygen -y -P "${RAD_PASSPHRASE}" -f "${RAD_HOME}/keys/radicle" > "${RAD_HOME}/keys/radicle.pub"
          else
            printf '\n' | RAD_PASSPHRASE='' rad auth --alias github-mirror --stdin
          fi
          echo "Using Radicle identity $(rad self --did)"
          rad node start
          rad node connect \
            "z6MkuyPDChcwCruKGd2tw54FZo2HemY135JvTLzbVTvoWKJR@index.radicle.garden:8776"
          rad clone "${RADICLE_REPOSITORY_ID}" "${RUNNER_TEMP}/radicle-source" \
            --seed "z6MkuyPDChcwCruKGd2tw54FZo2HemY135JvTLzbVTvoWKJR" \
            --timeout 120s

          git fetch "${RUNNER_TEMP}/radicle-source" master:refs/remotes/rad/master
          git fetch --prune origin master

      - name: Fast-forward GitHub master
        shell: bash
        run: |
          set -euo pipefail

          if ! git merge-base --is-ancestor origin/master rad/master; then
            echo "GitHub master has diverged from canonical Radicle master; refusing to overwrite it." >&2
            exit 1
          fi

          if test "$(git rev-parse origin/master)" = "$(git rev-parse rad/master)"; then
            echo "GitHub master is already synchronized."
            exit 0
          fi

          git push origin rad/master:master
