[project]
name = "missbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "agent-client-protocol>=0.11.0",
  "click>=8.3.1",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "httpx>=0.28.0",
  "logfire[httpx,redis]>=4.19.0",
  "mem0ai[nlp]>=2.0.10",
  "psycopg[binary,pool]>=3.3.4",
  "pydantic-ai>=2.13.0",
  "pyyaml>=6.0.3",
  "redis[hiredis]>=5.0.0",
  "spacy<3.8.14",
  "tenacity>=9.1.2",
  "websockets>=13.0.0",
]

[dependency-groups]
dev = [
  "anyio>=4.0.0",
  "fakeredis>=2.20.0",
  "ipykernel>=7.1.0",
  "basedpyright>=1.39.10",
  "pytest>=9.0.3",
  "pytest-cov>=5.0.0",
  "ruff>=0.15.6",
  "ty>=0.0.40",
]

[tool.coverage.run]
source = ["bot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.logfire]
ignore_no_config = true

[tool.basedpyright]
include = ["bot", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
# Check against the oldest interpreter the project claims to support, not whichever
# one happens to be in .venv.
pythonVersion = "3.13"

[[tool.basedpyright.executionEnvironments]]
root = "tests"
# An execution environment resolves imports against its own root, so the project
# root has to be added back or every `from bot... import` reads as unresolved.
extraPaths = ["."]
# Tests drive internals with duck-typed fakes: SimpleNamespace stands in for
# RunContext/ToolDefinition, and unbound methods are called with self=None so a
# pure function can be exercised without building a ChatAgent. Both are deliberate,
# and neither survives being made type-correct without burying the test in casts.
reportArgumentType = "none"

[tool.pytest.ini_options]
addopts = ["--cov=bot", "--cov-report=term-missing"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Keep Ruff 0.16's expanded defaults. Missbot deliberately catches broad exceptions
# at logged fail-soft boundaries so optional work cannot cancel replies or kill loops.
ignore = ["BLE001"]
