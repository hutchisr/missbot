[project]
name = "missbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "agent-client-protocol>=0.12.1",
  "click>=8.5.0",
  "hindsight-client>=1.0.0,<2.0.0",
  "httpx>=0.28.1",
  "logfire[httpx,redis]>=5.2.0",
  "nostr-sdk>=0.45.1,<0.46",
  "pydantic-ai[typesafe]>=2.57.0",
  "pydantic-ai-harness[codemode]>=0.57.0",
  "pyyaml>=6.0.3",
  "redis[hiredis]>=8.1.0",
  "tenacity>=9.1.4",
  "websockets>=16.1.1",
]

[dependency-groups]
dev = [
  "anyio>=4.15.1",
  "fakeredis>=2.40.0",
  "ipykernel>=7.4.0",
  "basedpyright>=1.40.2",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.1",
  "ty>=0.0.89",
]

[tool.coverage.run]
source = ["bot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.logfire]
ignore_no_config = true

[tool.basedpyright]
include = ["bot", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
# Check against the oldest interpreter the project claims to support, not whichever
# one happens to be in .venv.
pythonVersion = "3.13"

[[tool.basedpyright.executionEnvironments]]
root = "tests"
# An execution environment resolves imports against its own root, so the project
# root has to be added back or every `from bot... import` reads as unresolved.
extraPaths = ["."]
# Tests drive internals with duck-typed fakes: SimpleNamespace stands in for
# RunContext/ToolDefinition, and unbound methods are called with self=None so a
# pure function can be exercised without building a ChatAgent. Both are deliberate,
# and neither survives being made type-correct without burying the test in casts.
reportArgumentType = "none"

[tool.pytest.ini_options]
addopts = ["--cov=bot", "--cov-report=term-missing"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Keep Ruff 0.16's expanded defaults. Missbot deliberately catches broad exceptions
# at logged fail-soft boundaries so optional work cannot cancel replies or kill loops.
ignore = ["BLE001"]
